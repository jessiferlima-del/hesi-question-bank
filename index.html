<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HESI Question Bank</title><style>
:root{color-scheme:dark;--bg:#090a0c;--card:#242628;--card2:#181a1d;--line:#45484d;--txt:#f5f5f7;--muted:#a7a7ad;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--amber:#ffd60a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif}.app{max-width:820px;margin:auto;padding:24px 18px 80px}.top h1{font-size:28px;margin:4px 0}.top p{color:var(--muted);margin:5px 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tab,.mode,.answer,.small{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:18px;padding:16px;font-size:18px;font-weight:650}.tab.active{border-color:#315b91;background:#111b2a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center}.stat b{font-size:25px;display:block}.stat span{color:var(--muted)}.modes{display:flex;gap:8px;overflow:auto;padding:2px 0 15px}.mode{white-space:nowrap;padding:10px 14px;font-size:14px}.mode.active{background:#2c4668;border-color:#547eb4}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:3px;box-shadow:0 14px 35px #0005}.meta{display:flex;justify-content:space-between;color:#d2d2d7;font-weight:700}.counter{color:var(--muted);font-weight:500}.q{font-size:22px;line-height:1.42;font-weight:720;margin:24px 0}.answers{display:grid;gap:12px}.answer{text-align:left;font-weight:500;line-height:1.3;background:#2b2d30}.answer:hover{border-color:#777}.answer.correct{border-color:var(--green);background:#14371d}.answer.wrong{border-color:var(--red);background:#401816}.answer.dim{opacity:.62}.feedback{display:none;margin-top:18px;padding:16px;border-radius:18px;background:#16181a;line-height:1.45}.feedback.show{display:block}.feedback .result{font-size:20px;font-weight:800;margin-bottom:9px}.feedback .concept{margin-top:12px;padding-top:12px;border-top:1px solid #34363a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.small{font-size:16px;padding:13px}.next{background:var(--blue);border-color:var(--blue)}.source{font-size:12px;color:#777;margin-top:14px}.empty{color:var(--muted);text-align:center;padding:45px 10px}.footer{color:#85858b;font-size:13px;line-height:1.45;padding:18px 6px}.badge{display:inline-block;border:1px solid #5d6470;border-radius:999px;padding:4px 9px;font-size:12px;margin-left:7px;color:#d9d9df}@media(max-width:520px){.app{padding:16px 12px 60px}.q{font-size:20px}.card{padding:18px;border-radius:24px}.tab{font-size:17px;padding:15px 8px}.answer{font-size:17px;padding:15px}.stat{padding:13px 5px}.stat b{font-size:22px}}
</style></head><body><main class="app"><header class="top"><h1>HESI Question Bank</h1><p>Questões dos seus materiais • resposta + rationale • revisão inteligente</p></header><div class="tabs"><button id="Fundamentals" class="tab active" onclick="setSubject('Fundamentals')">🩺 Fundamentals</button><button id="Pharmacology" class="tab" onclick="setSubject('Pharmacology')">💊 Pharmacology</button></div><div class="stats"><div class="stat"><b id="ok">0</b><span>Acertos</span></div><div class="stat"><b id="bad">0</b><span>Erros</span></div><div class="stat"><b id="streak">0</b><span>Sequência</span></div></div><div class="modes"><button class="mode active" data-mode="practice" onclick="setMode('practice',this)">Practice</button><button class="mode" data-mode="wrong" onclick="setMode('wrong',this)">❌ Erradas</button><button class="mode" data-mode="reverse" onclick="setMode('reverse',this)">🔄 Reverse Challenge</button><button class="mode" data-mode="mixed" onclick="setMode('mixed',this)">🔀 Mixed Review</button></div><section class="card" id="card"></section><div class="footer">Seu progresso fica salvo neste aparelho/navegador. As questões originais e rationales vêm dos arquivos enviados; o modo Reverse é criado apenas para treino do mesmo conceito.</div></main><script>
const BANK=[{"id": "F1", "subject": "Fundamentals", "question": "Which nursing measure is essential to the client's nursing care?", "options": {"A": "Massage any reddened areas for at least five minutes.", "B": "Encourage active range of motion exercises on extremities.", "C": "Position the client laterally, prone, and dorsally in sequence.", "D": "Gently lift the client when moving into a desired position."}, "answer": "D", "rationale": "To avoid shearing forces when repositioning, the client should be lifted gently across a surface (D). Reddened areas should not be massaged (A) since this may increase the damage to already traumatized skin. To control pain and muscle spasms, active range of motion (B) may be limited on the affected leg. The position described in (C) is contraindicated for a client with a fractured left hip.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F2", "subject": "Fundamentals", "question": "The nurse is administering medications through a nasogastric tube (NGT) which is connected to suction. After ensuring correct tube placement, what action should the nurse take next?", "options": {"A": "Clamp the tube for 20 minutes.", "B": "Flush the tube with water.", "C": "Administer the medications as prescribed.", "D": "Crush the tablets and dissolve in sterile water."}, "answer": "B", "rationale": "The NGT should be flushed before, after and in between each medication administered (B). Once all medications are administered, the NGT should be clamped for 20 minutes (A). (C and D) may be implemented only after the tubing has been flushed.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F3", "subject": "Fundamentals", "question": "Which action should the nurse implement?", "options": {"A": "Give an around-the-clock schedule for administration of analgesics.", "B": "Administer analgesic medication as needed when the pain is severe.", "C": "Provide medication to keep the client sedated and unaware of stimuli.", "D": "Offer a medication-free period so that the client can do daily activities."}, "answer": "A", "rationale": "The most effective management of pain is achieved using an around-the-clock schedule that provides analgesic medications on a regular basis (A) and in a timely manner. Analgesics are less effective if pain persists until it is severe, so an analgesic medication should be administered before the client's pain peaks (B). Providing comfort is a priority for the client who is dying, but sedation that impairs the client's ability to interact and experience the time before life ends should be minimized (C). Offering a medication-free period allows the serum drug level to fall, which is not an effective method to manage chronic pain (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F4", "subject": "Fundamentals", "question": "What action should the nurse implement first?", "options": {"A": "Loosen the right wrist restraint.", "B": "Apply a pulse oximeter to the right hand.", "C": "Compare hand color bilaterally.", "D": "Palpate the right radial pulse."}, "answer": "A", "rationale": "The priority nursing action is to restore circulation by loosening the restraint (A), because blue fingers (cyanosis) indicates decreased circulation. (C and D) are also important nursing interventions, but do not have the priority of (A). Pulse oximetry (B) measures the saturation of hemoglobin with oxygen and is not indicated in situations where the cyanosis is related to mechanical compression (the restraints).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F5", "subject": "Fundamentals", "question": "Which client has the greatest nutritional need for additional intake of protein?", "options": {"A": "A college-age track runner with a sprained ankle.", "B": "A lactating woman nursing her 3-day-old infant.", "C": "A school-aged child with Type 2 diabetes.", "D": "An elderly man being treated for a peptic ulcer."}, "answer": "B", "rationale": "A lactating woman (B) has the greatest need for additional protein intake. (A, C, and D) are all conditions that require protein, but do not have the increased metabolic protein demands of lactation.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F6", "subject": "Fundamentals", "question": "What is the best intervention for the nurse to implement?", "options": {"A": "Contact the healthcare provider and complete a medication variance form.", "B": "Administer the Levaquin at 1300 and resume the 0900 schedule in the morning.", "C": "Notify the charge nurse and complete an incident report to explain the missed dose.", "D": "Give the missed dose at 1300 and change the schedule to administer daily at 1300."}, "answer": "D", "rationale": "To ensure that a therapeutic level of medication is maintained, the nurse should administer the missed dose as soon as possible, and revise the administration schedule accordingly to prevent dangerously increasing the level of the medication in the bloodstream (D). The nurse should document the reason for the late dose, but (A and C) are not warranted. (B) could result in increased blood levels of the drug.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F7", "subject": "Fundamentals", "question": "What nursing action should the nurse implement?", "options": {"A": "Acknowledge that she is supporting the arm correctly.", "B": "Encourage her to keep the joint covered to maintain warmth.", "C": "Reinforce the need to grip directly under the joint for better support.", "D": "Instruct her to grip directly over the joint for better motion."}, "answer": "A", "rationale": "The wife is performing the passive ROM correctly, therefore the nurse should acknowledge this fact (A). The joint that is being exercised should be uncovered (B) while the rest of the body should remain covered for warmth and privacy. (C and D) do not provide adequate support to the joint while still allowing for joint movement.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F8", "subject": "Fundamentals", "question": "What is the most important reason for starting intravenous infusions in the upper extremities rather than the lower extremities of adults?", "options": {"A": "It is more difficult to find a superficial vein in the feet and ankles.", "B": "A decreased flow rate could result in the formation of a thrombosis.", "C": "A cannulated extremity is more difficult to move when the leg or foot is used.", "D": "Veins are located deep in the feet and ankles, resulting in a more painful procedure."}, "answer": "B", "rationale": "Venous return is usually better in the upper extremities. Cannulation of the veins in the lower extremities increases the risk of thrombus formation (B) which, if dislodged, could be life-threatening. Superficial veins are often very easy (A) to find in the feet and legs. Handling a leg or foot with an IV (C) is probably not any more difficult than handling an arm or hand. Even if the nurse did believe moving a cannulated leg was more difficult, this is not the most important reason for using the upper extremities. Pain (D) is not a consideration.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F9", "subject": "Fundamentals", "question": "What action is most important for the nurse to implement?", "options": {"A": "Tell the UAP to use a larger cuff at the next scheduled assessment.", "B": "Reassess the client's blood pressure using a larger cuff.", "C": "Have the unit educator review this procedure with the UAPs.", "D": "Teach the UAP the correct technique for assessing blood pressure."}, "answer": "B", "rationale": "The most important action is to ensure that an accurate BP reading is obtained. The nurse should reassess the BP with the correct size cuff (B). Reassessment should not be postponed (A). Though (C and D) are likely indicated, these actions do not have the priority of (B).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F10", "subject": "Fundamentals", "question": "What is the best response by the nurse?", "options": {"A": "That means you have derived the maximum benefit, and the heat can be removed.", "B": "Your blood vessels are becoming dilated and removing the heat from the site.", "C": "We will increase the temperature 5 degrees when the pad no longer feels warm.", "D": "The body's receptors adapt over time as they are exposed to heat."}, "answer": "D", "rationale": "(D) describes thermal adaptation, which occurs 20 to 30 minutes after heat application. (A and B) provide false information. (C) is not based on a knowledge of physiology and is an unsafe action that may harm the client.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F11", "subject": "Fundamentals", "question": "What comment from the client indicates that the teaching has been effective?", "options": {"A": "If I exercise at least two times weekly for one hour, I will lower my cholesterol.", "B": "I need to avoid eating proteins, including red meat.", "C": "I will limit my intake of beef to 4 ounces per week.", "D": "My blood level of low density lipoproteins needs to increase."}, "answer": "C", "rationale": "Limiting saturated fat from animal food sources to no more than 4 ounces per week (C) is an important diet modification for lowering cholesterol. To be effective in reducing cholesterol, the client should exercise 30 minutes per day, or at least 4 to 6 times per week (A). Red meat and all proteins do not need to be eliminated (B) to lower cholesterol, but should be restricted to lean cuts of red meat and smaller portions (2-ounce servings). The low density lipoproteins (D) need to decrease rather than increase.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F12", "subject": "Fundamentals", "question": "What method describes the correct transfer procedure for this client?", "options": {"A": "Place the chair at a right angle to the bed on the client's left side before moving.", "B": "Assist the client to a standing position, then place the right hand on the armrest.", "C": "Have the client place the left foot next to the chair and pivot to the left before sitting.", "D": "Move the chair parallel to the right side of the bed, and stand the client on the right foot."}, "answer": "D", "rationale": "(D) uses the client's stronger side, the right side, for weight-bearing during the transfer, and is the safest approach to take. (A, B, and C) are unsafe methods of transfer and include the use of poor body mechanics by the caregiver.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F13", "subject": "Fundamentals", "question": "Which instruction should the nurse provide the UAP?", "options": {"A": "Position the client on the right side of the bed in reverse Trendelenburg.", "B": "Fill the enema container with 1000 ml of warm water and 5 ml of castile soap.", "C": "Reposition in a Sim's position with the client's weight on the anterior ilium.", "D": "Raise the side rails on both sides of the bed and elevate the bed to waist level."}, "answer": "B", "rationale": "The left sided Sims' position allows the enema solution to follow the anatomical course of the intestines and allows the best overall results, so the UAP should reposition the client in the Sims' position, which distributes the client's weight to the anterior ilium (C). (A) is inaccurate. (B and D) should be implemented once the client is positioned. Correct Answer: C A client who is a Jehovah's Witness is admitted to the nursing unit. Which concern should the nurse have for planning care in terms of the client's beliefs? A. Autopsy of the body is prohibited. B. Blood transfusions are forbidden. C. Alcohol use in any form is not allowed. D. A vegetarian diet must be followed. ✅- Blood transfusions are forbidden (B) in the Jehovah's Witness religion. Judaism prohibits (A). Buddhism forbids the use of (C) and drugs. Many of these sects are vegetarian (D), but the direct impact on nursing care is (B).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F14", "subject": "Fundamentals", "question": "What action should the nurse take first?", "options": {"A": "Observe the appearance of the skin under the ice pack.", "B": "Instruct the client regarding the need for the covering.", "C": "Reapply the covering after filling with fresh ice.", "D": "Ask the client how long the ice was applied to the skin."}, "answer": "D", "rationale": "The first action taken by the nurse should be to assess the skin for any possible thermal injury (A). If no injury to the skin has occurred, the nurse can take the other actions (B, C, and D) as needed. Correct Answer: A The nurse mixes 50 mg of Nipride in 250 ml of D5W and plans to administer the solution at a rate of 5 mcg/kg/min to a client weighing 182 pounds. Using a drip factor of 60 gtt/ml, how many drops per minute should the client receive? A. 31 gtt/min. B. 62 gtt/min. C. 93 gtt/min. D. 124 gtt/min. ✅- (D) is the correct calculation: Convert lbs to kg: 182/2.2 = 82.73 kg. Determine the dosage for this client: 5 mcg × 82.73 = 413.65 mcg/min. Determine how many mcg are contained in 1 ml: 250/50,000 mcg = 200 mcg per ml. The client is to receive 413.65 mcg/min, and there are 200 mcg/ml; so the client is to receive 2.07ml per minute. With a drip factor of 60 gtt/ml, then 60 × 2.07 = 124.28 gtt/min (D) OR, using dimensional analysis: gtt/min = 60 gtt/ml X 250 ml/50 mg X 1 mg/1,000 mcg X 5 mcg/kg/min X 1 kg/2.2 lbs X 182 lbs.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F15", "subject": "Fundamentals", "question": "What action is best for the nurse to take?", "options": {"A": "Record the coughing incident. No further action is required at this time.", "B": "Stop the feeding, explain to the family why it is being stopped, and notify the healthcare provider.", "C": "After clearing the tube with 30 ml of air, check the pH of fluid withdrawn from the tube.", "D": "Inject 30 ml of air into the tube while auscultating the epigastrium for gurgling."}, "answer": "C", "rationale": "Coughing, vomiting, and suctioning can precipitate displacement of the tip of the small bore feeding tube upward into the esophagus, placing the client at increased risk for aspiration. Checking the sample of fluid withdrawn from the tube (after clearing the tube with 30 ml of air) for acidic (stomach) or alkaline (intestine) values is a more sensitive method for these tubes, and the nurse should assess tube placement in this way prior to taking any other action (C). (A and B) are not indicated. The auscultating method (D) has been found to be unreliable for small-bore feeding tubes.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F16", "subject": "Fundamentals", "question": "A male client being discharged with a prescription for the bronchodilator theophylline tells the nurse that he understands he is to take three doses of the medication each day. Since, at the time of discharge, timed-release capsules are not available, which dosing schedule should the nurse advise the client to follow?", "options": {"A": "9 a.m., 1 p.m., and 5 p.m.", "B": "8 a.m., 4 p.m., and midnight.", "C": "Before breakfast, before lunch and before dinner.", "D": "With breakfast, with lunch, and with dinner."}, "answer": "B", "rationale": "Theophylline should be administered on a regular around-the-clock schedule (B) to provide the best bronchodilating effect and reduce the potential for adverse effects. (A, C, and D) do not provide around-the-clock dosing. Food may alter absorption of the medication (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F17", "subject": "Fundamentals", "question": "A client is to receive 10 mEq of KCl diluted in 250 ml of normal saline over 4 hours. At what rate should the nurse set the client's intravenous infusion pump?", "options": {"A": "13 ml/hour.", "B": "63 ml/hour.", "C": "80 ml/hour.", "D": "125 ml/hour."}, "answer": "B", "rationale": "(B) is the correct calculation: To calculate this problem correctly, remember that the dose of KCl is not used in the calculation. 250 ml/4 hours = 63 ml/hour.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F18", "subject": "Fundamentals", "question": "An obese male client discusses with the nurse his plans to begin a long-term weight loss regimen. In addition to dietary changes, he plans to begin an intensive aerobic exercise program 3 to 4 times a week and to take stress management classes. After praising the client for his decision, which instruction is most important for the nurse to provide?", "options": {"A": "Be sure to have a complete physical examination before beginning your planned exercise program.", "B": "Be careful that the exercise program doesn't simply add to your stress level, making you want to eat more.", "C": "Increased exercise helps to reduce stress, so you may not need to spend money on a stress management class.", "D": "Make sure to monitor your weight loss regularly to provide a sense of accomplishment and motivation."}, "answer": "A", "rationale": "The most important teaching is (A), so that the client will not begin a dangerous level of exercise when he is not sufficiently fit. This might result in chest pain, a heart attack, or stroke. (B, C, and D) are important instructions, but are of less priority than (A).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F19", "subject": "Fundamentals", "question": "When should the client administer the inhaler-delivered medication to demonstrate correct use of the inhaler?", "options": {"A": "Immediately after exhalation.", "B": "During the inhalation.", "C": "At the end of three inhalations.", "D": "Immediately after inhalation."}, "answer": "B", "rationale": "The client should be instructed to deliver the medication during the last part of inhalation (B). After the medication is delivered, the client should remove the mouthpiece, keeping his/her lips closed and breath held for several seconds to allow for distribution of the medication. The client should not deliver the dose as stated in (A or D), and should deliver no more than two inhalations at a time (C).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F20", "subject": "Fundamentals", "question": "The healthcare provider prescribes the diuretic metolazone (Zaroxolyn) 7.5 mg PO. Zaroxolyn is available in 5 mg tablets. How much should the nurse plan to administer?", "options": {"A": "½ tablet.", "B": "1 tablet.", "C": "1½ tablets.", "D": "2 tablets."}, "answer": "C", "rationale": "(C) is the correct calculation: D/H × Q = 7.5/5 × 1 tablet = 1½ tablets.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F21", "subject": "Fundamentals", "question": "The healthcare provider prescribes furosemide (Lasix) 15 mg IV stat. On hand is Lasix 20 mg/2 ml. How many milliliters should the nurse administer?", "options": {"A": "1 ml.", "B": "1.5 ml.", "C": "1.75 ml.", "D": "2 ml."}, "answer": "A", "rationale": "(B) is the correct calculation: Dosage on hand/amount on hand = Dosage desired/x amount. 20 mg : 2 ml = 15 mg : x . 20x = 30. x = 30/20; = 1½ or 1.5 ml. Correct Answer: B Heparin 20,000 units in 500 ml D5W at 50 ml/hour has been infusing for 5½ hours. How much heparin has the client received? A. 11,000 units. B. 13,000 units. C. 15,000 units. D. 17,000 units. ✅- (A) is the correct calculation: 20,000 units/500 ml = 40 units (the amount of units in one ml of fluid). 40 units/ml x 50 ml/hr = 2,000 units/hour (1,000 units in 1/2 hour). 5.5 x 2,000 = 11,000 (A). OR, multiply 5 x 2,000 and add the 1/2 hour amount of 1,000 to reach the same conclusion = 11,000 units.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F22", "subject": "Fundamentals", "question": "The healthcare provider prescribes morphine sulfate 4mg IM STAT. Morphine comes in 8 mg per ml. How many ml should the nurse administer?", "options": {"A": "0.5 ml.", "B": "1 ml.", "C": "1.5 ml.", "D": "2 ml."}, "answer": "A", "rationale": "Using ratio and proportion: 8mg: 1ml :: 4mg:Xml 8X=4 X=0.5", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F23", "subject": "Fundamentals", "question": "The nurse should regulate the IV to administer approximately how many drops per minute?", "options": {"A": "80", "B": "8", "C": "21", "D": "25"}, "answer": "C", "rationale": "The accepted formula for figuring drops per minute is: amount to be infused in one hour × drop factor/time for infusion (min)= drops per minute. Using this formula: 1,000/8 hours = 125 ml/ hour 125 × 10 (drip factor) = 1,250 drops in one hour. 1,250/ 60 (number of minutes in one hour) = 20.8 or 21 gtt/min (C).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F24", "subject": "Fundamentals", "question": "Which action is most important for the nurse to implement when donning sterile gloves?", "options": {"A": "Maintain thumb at a ninety degree angle.", "B": "Hold hands with fingers down while gloving.", "C": "Keep gloved hands above the elbows.", "D": "Put the glove on the dominant hand first."}, "answer": "C", "rationale": "Gloved hands held below waist level are considered unsterile (C). (A and B) are not essential to maintaining asepsis. While it may be helpful to put the glove on the dominant hand first, it is not necessary to ensure asepsis (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F25", "subject": "Fundamentals", "question": "What initial action is most important for the nurse to take?", "options": {"A": "Ask about any past history of drug abuse or addiction.", "B": "Measure the pulse volume and capillary refill distal to the infiltration.", "C": "Compress the infiltrated tissue to measure the degree of edema.", "D": "Evaluate the extent of ecchymosis over the forearm area."}, "answer": "B", "rationale": "Pain and diminished pulse volume (B) are signs of compartment syndrome, which can progress to complete loss of the peripheral pulse in the extremity. Compartment syndrome occurs when external pressure (usually from a cast), or internal pressure (usually from subcutaneous infused fluid), exceeds capillary perfusion pressure resulting in decreased blood flow to the extremity. (A) should not be pursued until physical causes of the pain are ruled out. (C) is of less priority than determining the effects of the edema on circulation and nerve function. Further assessment of the client's ecchymosis can be delayed until the signs of edema and compression that suggest compartment syndrome have been examined (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F26", "subject": "Fundamentals", "question": "What is the best client position for administration of the bolus tube feedings?", "options": {"A": "Prone.", "B": "Fowler's.", "C": "Sims'.", "D": "Supine."}, "answer": "B", "rationale": "The client should be positioned in a semi-sitting (Fowler's) (B) position during feeding to decrease the occurrence of aspiration. A gastrostomy tube, known as a PEG tube, due to placement by a percutaneous endoscopic gastrostomy procedure, is inserted directly into the stomach through an incision in the abdomen for long-term administration of nutrition and hydration in the debilitated client. In (A and/or C), the client is placed on the abdomen, an unsafe position for feeding. Placing the client in (D) increases the risk of aspiration.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F27", "subject": "Fundamentals", "question": "A 73-year-old female client had a hemiarthroplasty of the left hip yesterday due to a fracture resulting from a fall. In reviewing hip precautions with the client, which instruction should the nurse include in this client's teaching plan?", "options": {"A": "In 8 weeks you will be able to bend at the waist to reach items on the floor.", "B": "Place a pillow between your knees while lying in bed to prevent hip dislocation.", "C": "It is safe to use a walker to get out of bed, but you need assistance when walking.", "D": "Take pain medication 30 minutes after your physical therapy sessions."}, "answer": "B", "rationale": "The client's affected hip joint following a hemiarthroplasty (partial hip replacement) is at risk of dislocation for 6 months to a year following the procedure. Hip precautions to prevent dislocation include placing a pillow between the knees to maintain abduction of the hips (B). Clients should be instructed to avoid bending at the waist (A), to seek assistance for both standing and walking until they are stable on a walker or cane (C), and to take pain medication 20 to 30 minutes prior to physical therapy sessions, rather than waiting until the pain level is high after their therapy.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F28", "subject": "Fundamentals", "question": "A client with pneumonia has a decrease in oxygen saturation from 94% to 88% while ambulating. Based on these findings, which intervention should the nurse implement first?", "options": {"A": "Assist the ambulating client back to the bed.", "B": "Encourage the client to ambulate to resolve pneumonia.", "C": "Obtain a prescription for portable oxygen while ambulating.", "D": "Move the oximetry probe from the finger to the earlobe."}, "answer": "A", "rationale": "An oxygen saturation below 90% indicates inadequate oxygenation. First, the client should be assisted to return to bed (A) to minimize oxygen demands. Ambulation increases aeration of the lungs to prevent pooling of respiratory secretions, but the client's activity at this time is depleting oxygen saturation of the blood, so (B) is contraindicated. Increased activity increases respiratory effort, and oxygen may be necessary to continue ambulation (C), but first the client should return to bed to rest. Oxygen saturation levels at different sites should be evaluated after the client returns to bed (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F29", "subject": "Fundamentals", "question": "What action should the nurse take?", "options": {"A": "Commend the client for selecting a high biologic value protein.", "B": "Remind the client that protein in the diet should be avoided.", "C": "Suggest that the client also select orange juice, to promote absorption.", "D": "Encourage the client to attend classes on dietary management of CRF."}, "answer": "A", "rationale": "Foods such as eggs and milk (A) are high biologic proteins which are allowed because they are complete proteins and supply the essential amino acids that are necessary for growth and cell repair. Although a low-protein diet is followed (B), some protein is essential. Orange juice is rich in potassium, and should not be encouraged (C). The client has made a good diet choice, so (D) is not necessary.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F30", "subject": "Fundamentals", "question": "What question is most important for the nurse to include during the preoperative assessment?", "options": {"A": "What is your daily calorie consumption?", "B": "What vitamin and mineral supplements do you take?", "C": "Do you feel that you are overweight?", "D": "Will a clear liquid diet be okay after surgery?"}, "answer": "D", "rationale": "Vitamin and mineral supplements (B) may impact medications used during the operative period. (A and C) are appropriate questions for long-term dietary counseling. The nature of the surgery and anesthesia will determine the need for a clear liquid diet (D), rather than the client's preference. Correct Answer: B During the initial morning assessment, a male client denies dysuria but reports that his urine appears dark amber. Which intervention should the nurse implement? A. Provide additional coffee on the client's breakfast tray. B. Exchange the client's grape juice for cranberry juice. C. Bring the client additional fruit at mid-morning. D. Encourage additional oral intake of juices and water. ✅- Dark amber urine is characteristic of fluid volume deficit, and the client should be encouraged to increase fluid intake (D). Caffeine, however, is a diuretic (A), and may worsen the fluid volume deficit. Any type of juice will be beneficial (B), since the client is not dysuric, a sign of an urinary tract infection. The client needs to restore fluid volume more than solid foods (C).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F31", "subject": "Fundamentals", "question": "Which intervention is most important for the nurse to implement for a male client who is experiencing urinary retention?", "options": {"A": "Apply a condom catheter.", "B": "Apply a skin protectant.", "C": "Encourage increased fluid intake.", "D": "Assess for bladder distention."}, "answer": "D", "rationale": "Urinary retention is the inability to void all urine collected in the bladder, which leads to uncomfortable bladder distention (D). (A and B) are useful actions to protect the skin of a client with urinary incontinence. (C) may worsen the bladder distention.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F32", "subject": "Fundamentals", "question": "Which intervention is most important for the nurse to implement?", "options": {"A": "Obtain the pre-transfusion hemoglobin level.", "B": "Prime the tubing and prepare a blood pump set-up.", "C": "Monitor vital signs q15 minutes for the first hour.", "D": "Ensure the accuracy of the blood type match."}, "answer": "D", "rationale": "All interventions should be implemented prior to administering blood, but (D) has the highest priority. Any time blood is administered, the nurse should ensure the accuracy of the blood type match in order to prevent a possible hemolytic reaction.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F33", "subject": "Fundamentals", "question": "Which snack food is best for the nurse to provide a client with myasthenia gravis who is at risk for altered nutritional status?", "options": {"A": "Chocolate pudding.", "B": "Graham crackers.", "C": "Sugar free gelatin.", "D": "Apple slices."}, "answer": "A", "rationale": "The client with myasthenia gravis is at high risk for altered nutrition because of fatigue and muscle weakness resulting in dysphagia. Snacks that are semisolid, such as pudding (A) are easy to swallow and require minimal chewing effort, and provide calories and protein. (C) does not provide any nutritional value. (B and D) require energy to chew and are more difficult to swallow than pudding.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F34", "subject": "Fundamentals", "question": "The nurse is evaluating client learning about a low-sodium diet. Selection of which meal would indicate to the nurse that this client understands the dietary restrictions?", "options": {"A": "Tossed salad, low-sodium dressing, bacon and tomato sandwich.", "B": "New England clam chowder, no-salt crackers, fresh fruit salad.", "C": "Skim milk, turkey salad, roll, and vanilla ice cream.", "D": "Macaroni and cheese, diet Coke, a slice of cherry pie."}, "answer": "C", "rationale": "Skim milk, turkey, bread, and ice cream (C), while containing some sodium, are considered low-sodium foods. Bacon (A), canned soups (B), especially those with seafood, hard cheeses, macaroni, and most diet drinks (D) are very high in sodium.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F35", "subject": "Fundamentals", "question": "Which nutritional assessment data should the nurse collect to best reflect total muscle mass in an adolescent?", "options": {"A": "Height in inches or centimeters.", "B": "Weight in kilograms or pounds.", "C": "Triceps skin fold thickness.", "D": "Upper arm circumference."}, "answer": "D", "rationale": "Upper arm circumference (D) is an indirect measure of muscle mass. (A and B) do not distinguish between fat (adipose) and muscularity. (C) is a measure of body fat.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F36", "subject": "Fundamentals", "question": "What action should the nurse implement first?", "options": {"A": "Reaffirm the client's desire for no resuscitative efforts.", "B": "Transfer the client to a hospice inpatient facility.", "C": "Prepare the family for the client's impending death.", "D": "Notify the healthcare provider of the family's request."}, "answer": "D", "rationale": "The nurse should first communicate with the healthcare provider (D). Hospice care is provided for clients with a limited life expectancy, which must be identified by the healthcare provider. (A) is not necessary at this time. Once the healthcare provider supports the transfer to hospice care, the nurse can collaborate with the hospice staff and healthcare provider to determine when (B and C) should be implemented.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F37", "subject": "Fundamentals", "question": "After completing an assessment and determining that a client has a problem, which action should the nurse perform next?", "options": {"A": "Determine the etiology of the problem.", "B": "Prioritize nursing care interventions.", "C": "Plan appropriate interventions.", "D": "Collaborate with the client to set goals."}, "answer": "A", "rationale": "Before planning care, the nurse should determine the etiology, or cause, of the problem (A), because this will help determine (B, C, and D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F38", "subject": "Fundamentals", "question": "Which nurse is at greatest risk for a malpractice judgment?", "options": {"A": "A nurse who worked the 7 to 3 shift at the hospital and wrote poor nursing notes.", "B": "The nurse assigned to care for the client who was at lunch at the time of the fall.", "C": "The nurse who transferred the client to the chair when the fall occurred.", "D": "The charge nurse who completed rounds 30 minutes before the fall occurred."}, "answer": "C", "rationale": "The four elements of malpractice are: breach of duty owed, failure to adhere to the recognized standard of care, direct causation of injury, and evidence of actual injury. The hip fracture is the actual injury and the standard of care was \"frequent monitoring.\" (C) implies that duty was owed and the injury occurred while the nurse was in charge of the client's care. There is no evidence of negligence in (A, B, and D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F39", "subject": "Fundamentals", "question": "Which action will the nurse implement first?", "options": {"A": "Establish a new nursing diagnosis.", "B": "Note which actions were not implemented.", "C": "Add additional nursing orders to the plan.", "D": "Collaborate with the healthcare provider to make changes."}, "answer": "B", "rationale": "First, the nurse reviews which actions in the original plan were not implemented (B) in order to determine why the original plan did not produce the desired outcome. Appropriate revisions can then be made, which may include revising the expected outcome, or identifying a new nursing diagnosis (A). (C) may be needed if the nursing actions were unsuccessful, or were unable to be implemented. (D) other members of the healthcare team may be necessary to collaborate changes once the nurse determines why the original plan did not produce the desired outcome.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F40", "subject": "Fundamentals", "question": "The nurse plans to set the flow rate at how many gtt/min?", "options": {"A": "42 gtt/min.", "B": "83 gtt/min.", "C": "125 gtt/min.", "D": "250 gtt/min."}, "answer": "B", "rationale": "gtt/min = 20gtts/ml X 1000 ml/4hrs X 1 hr/60 min", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F41", "subject": "Fundamentals", "question": "Seconal 0.1 gram PRN at bedtime is prescribed to a client for rest. The scored tablets are labeled grain 1.5 per tablet. How many tablets should the nurse plan to administer?", "options": {"A": "0.5 tablet.", "B": "1 tablet.", "C": "1.5 tablets.", "D": "2 tablets."}, "answer": "B", "rationale": "15 gr=1 Gm. Converting the prescribed dose of 0.1 grams to grains requires multiplying 0.1 × 15 = 1.5 grains. The tablets come in 1.5 grains, so the nurse should plan to administer 1 tablet (B).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F42", "subject": "Fundamentals", "question": "Which assessment data would provide the most accurate determination of proper placement of a nasogastric tube?", "options": {"A": "Aspirating gastric contents to assure a pH value of 4 or less.", "B": "Hearing air pass in the stomach after injecting air into the tubing.", "C": "Examining a chest x-ray obtained after the tubing was inserted.", "D": "Checking the remaining length of tubing to ensure that the correct length was inserted."}, "answer": "C", "rationale": "Both (A and B) are methods used to determine proper placement of the NG tubing. However, the best indicator that the tubing is properly placed is (C). (D) is not an indicator of proper placement.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F43", "subject": "Fundamentals", "question": "What immediate action should the nurse take?", "options": {"A": "Infuse normal saline at a keep vein open rate.", "B": "Discontinue the IV and flush the port with heparin.", "C": "Infuse 10 percent dextrose and water at 54 ml/hr.", "D": "Obtain a stat blood glucose level and notify the healthcare provider."}, "answer": "C", "rationale": "TPN is discontinued gradually to allow the client to adjust to decreased levels of glucose. Administering 10% dextrose in water at the prescribed rate (C) will keep the client from experiencing hypoglycemia until the next TPN solution is available. The client could experience a hypoglycemic reaction if the current level of glucose (A) is not maintained or if the TPN is discontinued abruptly (B). There is no reason to obtain a stat blood glucose level (D) and the healthcare provider cannot do anything about this situation.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F44", "subject": "Fundamentals", "question": "What action should the nurse take?", "options": {"A": "Talk directly to the child instead of the mother.", "B": "Continue asking the mother questions about the child.", "C": "Ask another nurse to interview the mother now.", "D": "Tell the mother politely to look at you when answering."}, "answer": "B", "rationale": "Eye contact is a culturallyinfluenced form of non-verbal communication. In some non-Western cultures, such as the Vietnamese culture, a client or family member may avoid eye contact as a form of respect, so the nurse should continue to ask the mother questions about the child (B). (A, C, and D) are not indicated.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F45", "subject": "Fundamentals", "question": "Which statement is accurate regarding the use of these practices?", "options": {"A": "Complimentary healing practices interfere with the efficacy of the medical model of treatment.", "B": "Conventional medications are likely to interact with folk remedies and cause adverse effects.", "C": "Many complimentary healing practices can be used in conjunction with conventional practices.", "D": "Conventional medical practices will ultimately replace the use of complimentary healing practices."}, "answer": "C", "rationale": "Conventional approaches to health care can be depersonalizing and often fail to take into consideration all aspects of an individual, including body, mind, and spirit. Often complimentary healing practices can be used in conjunction with conventional medical practices (C), rather than interfering (A) with conventional practices, causing adverse effects (B), or replacing conventional medical care (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F46", "subject": "Fundamentals", "question": "What information should the nurse obtain first?", "options": {"A": "Sexual activity patterns.", "B": "Nutritional history.", "C": "Leisure activities.", "D": "Financial stressors."}, "answer": "B", "rationale": "Caffeine, sugars, and alcohol can lead to increased levels of anxiety, so a nutritional history (C) should be obtained first so that health teaching can be initiated if indicated. (A and C) can be used for stress management. Though (D) can be a source of anxiety, a nutritional history should be obtained first.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F47", "subject": "Fundamentals", "question": "What is the best response by the nurse?", "options": {"A": "Reassure the client that he will become accustomed to the stoma appearance in time.", "B": "Instruct the client that the stoma will become smaller when the initial swelling diminishes.", "C": "Offer to contact a member of the local ostomy support group to help him with his concerns.", "D": "Encourage the client to handle the stoma equipment to gain confidence with the procedure."}, "answer": "B", "rationale": "Postoperative swelling causes enlargement of the stoma. The nurse can teach the client that the stoma will become smaller when the swelling is diminished (B). This will help reduce the client's anxiety and promote acceptance of the colostomy. (A) does not provide helpful teaching or support. (C) is a useful action, and may be taken after the nurse provides pertinent teaching. The client is not yet demonstrating readiness to learn colostomy care (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F48", "subject": "Fundamentals", "question": "What would be an appropriate response to this client's silence?", "options": {"A": "It is normal to feel angry and depressed, but the sooner you deal with this surgery, the better you will feel.", "B": "Looking at your incision can be frightening, but facing this fear is a necessary part of your recovery.", "C": "It is OK if you don't want to talk about your surgery. I will be available when you are ready.", "D": "I will ask a woman who has had a mastectomy to come by and share her experiences with you."}, "answer": "C", "rationale": "(C) displays sensitivity and understanding without judging the client. (A) is judgmental in that it is telling the client how she feels and is also insensitive. (B) would give the client a chance to talk, but is also demanding and demeaning. (D) displays a positive action, but, because the nurse's personal support is not offered, this response could be interpreted as dismissing the client and avoiding the problem.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F49", "subject": "Fundamentals", "question": "Which statement best explains this nursing responsibility?", "options": {"A": "The client voluntarily signed the form.", "B": "The client fully understands the procedure.", "C": "The client agrees with the procedure to be done.", "D": "The client authorizes continued treatment."}, "answer": "A", "rationale": "The nurse signs the consent form to witness that the client voluntarily signs the consent (A), that the client's signature is authentic, and that the client is otherwise competent to give consent. It is the healthcare provider's responsibility to ensure the client fully understands the procedure (B). The nurse's signature does not indicate (C or D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F50", "subject": "Fundamentals", "question": "What instructions should the nurse give the UAP?", "options": {"A": "Remain calm with the client and record abnormal results in the chart.", "B": "Notify the medication nurse immediately if the pulse or blood pressure is low.", "C": "Report the results of the vital signs to the nurse.", "D": "Reassure the client that the vital signs are normal."}, "answer": "C", "rationale": "Interpretation of vital signs is the responsibility of the nurse, so the UAP should report vital sign measurements to the nurse (C). (A, B, and D) require the UAP to interpret the vital signs, which is beyond the scope of the UAP's authority.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F51", "subject": "Fundamentals", "question": "What should be the nurse's first response?", "options": {"A": "It is important that you continue your medication while learning to meditate.", "B": "Spiritual meditation requires a time commitment of 15 to 20 minutes daily.", "C": "Obtain your healthcare provider's permission before starting meditation.", "D": "Complementary therapy and western medicine can be effective for you."}, "answer": "A", "rationale": "The prolonged practice of meditation may lead to a reduced need for antihypertensive medications. However, the medications must be continued (A) while the physiologic response to meditation is monitored. (B) is not as important as continuing the medication. The healthcare provider should be informed, but permission is not required to meditate (C). Although it is true that this complimentary therapy might be effective (D), it is essential that the client continue with antihypertensive medications until the effect of meditation can be measured.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F52", "subject": "Fundamentals", "question": "Examination of a client complaining of itching on his right arm reveals a rash made up of multiple flat areas of redness ranging from pinpoint to 0.5 cm in diameter. How should the nurse record this finding?", "options": {"A": "Multiple vesicular areas surrounded by redness, ranging in size from 1 mm to 0.5 cm.", "B": "Localized red rash comprised of flat areas, pinpoint to 0.5 cm in diameter.", "C": "Several areas of red, papular lesions from pinpoint to 0.5 cm in size.", "D": "Localized petechial areas, ranging in size from pinpoint to 0.5 cm in diameter."}, "answer": "B", "rationale": "Macules are localized flat skin discolorations less than 1 cm in diameter. However, when recording such a finding the nurse should describe the appearance (B) rather than simply naming the condition. (A) identifies vesicles -- fluid filled blisters -- an incorrect description given the symptoms listed. (C) identifies papules -- solid elevated lesions, again not correctly identifying the symptoms. (D) identifies petechiae -- pinpoint red to purple skin discolorations that do not itch, again an incorrect identification.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F53", "subject": "Fundamentals", "question": "Which area of the brain controls these neuro-cognitive functions?", "options": {"A": "Thalamus.", "B": "Hypothalamus.", "C": "Frontal lobe.", "D": "Parietal lobe."}, "answer": "C", "rationale": "The frontal lobe (C) of the cerebrum controls higher mental activities, such as memory, intellect, language, emotions, and personality. (A) is an afferent relay center in the brain that directs impulses to the cerebral cortex. (B) regulates body temperature, appetite, maintains a wakeful state, and links higher centers with the autonomic nervous and endocrine systems, such as the pituitary. (D) is the location of sensory and motor functions.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F54", "subject": "Fundamentals", "question": "What data should the nurse document that is most accurate?", "options": {"A": "demonstrates loss of remote memory.", "B": "exhibits expressive dysphasia.", "C": "has a diminished attention span.", "D": "is disoriented to place and time."}, "answer": "D", "rationale": "The client is exhibiting disorientation (D). (A) refers to memory of the distant past. The client is able to express himself without difficulty (B), and does not demonstrate a diminished attention span (C).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F55", "subject": "Fundamentals", "question": "An IV infusion terbutaline sulfate 5 mg in 500 ml of D5W, is infusing at a rate of 30 mcg/min prescribed for a client in premature labor. How many ml/hr should the nurse set the infusion pump?", "options": {"A": "30", "B": "60", "C": "120", "D": "180"}, "answer": "D", "rationale": "(D) is correct calculation: 180 ml/hr = 500 ml/5 mg × 1mg/1000 mcg × 30 mcg/min × 60 min/hr.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F56", "subject": "Fundamentals", "question": "An African-American grandmother tells the nurse that her 4-year-old grandson is suffering with \"miseries.\" Based on this statement, which focused assessment should the nurse conduct?", "options": {"A": "Inquire about the source and type of pain.", "B": "Examine the nose for congestion and discharge.", "C": "Take vital signs for temperature elevation.", "D": "Explore the abdominal area for distension."}, "answer": "A", "rationale": "Different cultural groups often have their own terms for health conditions. African-American clients may refer to pain as \"the miseries. \" Based on understanding this term, the nurse should conduct a focused assessment on the source and type of pain (A). (B, C, and D) are important, but do not focus on \"miseries\" (pain).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F57", "subject": "Fundamentals", "question": "What explanation is most appropriate for this behavior?", "options": {"A": "The belief is held that the \"evil eye\" enters the child if anything cold is ingested.", "B": "After surgery the child probably has refused all foods except broth.", "C": "Eating broth strengthens the child's innate energy called \"chi.\"", "D": "Hot remedies restore balance after surgery, which is considered a \"cold\" condition."}, "answer": "D", "rationale": "Common parental practices and health beliefs among Hispanic, Chinese, Filipino, and Arab cultures classify diseases, areas of the body, and illnesses as \"hot\" or \"cold\" and must be balanced to maintain health and prevent illness. The perception that surgery is a \"cold\" condition implies that only \"hot\" remedies, such as soup, should be used to restore the healthy balance within the body, so (D) is the correct interpretation. (A, B, and C) are not correct interpretations of the noted behavior. \"Chi\" is a Chinese belief that an innate energy enters and leaves the body via certain locations and pathways and maintains health. The \"evil eye,\" or \"mal ojo,\" is believed by many cultures to be related to the balance of health and illness but is unrelated to dietary practice.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F58", "subject": "Fundamentals", "question": "Which action should the nurse take at this time?", "options": {"A": "Administer the medication more rapidly using the same IV site.", "B": "Initiate an alternate site for the IV infusion of the medication.", "C": "Notify the healthcare provider before administering the next dose.", "D": "Give the client a PRN dose of aspirin while the medication infuses."}, "answer": "B", "rationale": "A cephalosporin antibiotic that is administered IV may cause vessel irritation. Rotating the infusion site minimizes the risk of thrombophlebitis, so an alternate infusion site should be initiated (B) before administering the next dose. Rapid administration (A) of intravenous cephalosporins can potentiate vessel irritation and increase the risk of thrombophlebitis. (C) is not necessary to initiate an alternative IV site. Although aspirin has antiinflammatory actions, (D) is not indicated.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F59", "subject": "Fundamentals", "question": "What action should the nurse implement next?", "options": {"A": "Encourage the client to cough to help loosen secretions.", "B": "Advise the client to increase the intake of oral fluids.", "C": "Rotate the suction catheter to obtain any remaining secretions.", "D": "Re-oxygenate the client before attempting to suction again."}, "answer": "D", "rationale": "Suctioning should not be continued for longer than ten to fifteen seconds, since the client's oxygenation is compromised during this time (D). (A, B, and C) may be performed after the client is reoxygenated and additional suctioning is performed.", "source": "Hesi Fundamental Questions.pdf"}, {"id": "F60", "subject": "Fundamentals", "question": "What action should the nurse take first?", "options": {"A": "Irrigate the nasogastric tube with sterile normal saline.", "B": "Reposition the client on her side.", "C": "Advance the nasogastric tube an additional five centimeters.", "D": "Administer an intravenous antiemetic prescribed for PRN use."}, "answer": "B", "rationale": "The immediate priority is to determine if the tube is functioning correctly, which would then relieve the client's nausea. The least invasive intervention, (B), should be attempted first, followed by (A and C), unless either of these interventions is contraindicated. If these measures are unsuccessful, the client may require an antiemetic (D).", "source": "Hesi Fundamental Questions.pdf"}, {"id": "P1", "subject": "Pharmacology", "question": "A female client with mild depression reports to the nurse recently starting St. John's wort. Which information provided by the client requires further instruction?", "options": {"A": "Hard candy can be used for a dry mouth.", "B": "Another form of contraception is not needed.", "C": "Insomnia may occur while taking the medication.", "D": "Sensitivity to the sun can develop."}, "answer": "B", "rationale": "A: Hard candy can be used for a dry mouth, which is a common side effect of St. John's wort. B: Another form of contraception is needed, because St. John's wort can reduce the effectiveness of oral contraceptives and increase the risk of unplanned pregnancy. This information requires further instruction from the nurse. C: Insomnia may occur while taking the medication, which is another possible side effect of St. John's wort. The client should be advised to take the medication in the morning or afternoon, and avoid caffeine and alcohol. D: Sensitivity to the sun can develop, which is a rare but serious side effect of St. John's wort. The client should be instructed to wear sunscreen and protective clothing when exposed to sunlight.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P2", "subject": "Pharmacology", "question": "A client who is taking an oral dose of a tetracycline reports gastrointestinal (GI) upset. Which snack should the nurse instruct the client to take with the tetracycline?", "options": {"A": "Cheese and crackers.", "B": "Toasted wheat bread and jelly.", "C": "Fruit-flavored yogurt.", "D": "Cold cereal with skim milk."}, "answer": "B", "rationale": "A: Cheese and crackers are not a good snack to take with tetracycline, because cheese contains calcium, which can interfere with the absorption of tetracycline and reduce its effectiveness. B: Toasted wheat bread and jelly are a suitable snack to take with tetracycline, because they do not contain any dairy products or iron, which can also affect the absorption of tetracycline. Toasted bread may also help to settle the stomach and prevent nausea. C: Fruit-flavored yogurt is not a good snack to take with tetracycline, because yogurt is a dairy product that contains calcium, which can interfere with the absorption of tetracycline and reduce its effectiveness. D: Cold cereal with skim milk is not a good snack to take with tetracycline, because skim milk is a dairy product that contains calcium, which can interfere with the absorption of tetracycline and reduce its effectiveness.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P3", "subject": "Pharmacology", "question": "To prevent deep vein thromboses following knee replacement surgery, an adult male client is receiving daily subcutaneous enoxaparin. Which laboratory result requires immediate action by the nurse? Reference Range: Hematocrit [42% to 52% (0.42 to 0.52 volume fraction)] Platelets [150,000 to 400,000/mm² (150 to 400 × 10^9/L)] Creatinine [0.5 to 1.1 mg/dL (44 to 97 μmol/L)] Blood Urea Nitrogen (BUN) [10 to 20 mg/dL (3.6 to 7.1 mmol/L)]", "options": {"A": "Platelet count of 100,000/mm³ (100 x 10^9/L).", "B": "Hematocrit 45% (0.45 volume fraction).", "C": "Blood urea nitrogen (BUN) 20 mg/dL (7.1 mmol/L).", "D": "Serum creatinine 1.0 mg/dL (88.4 μmol/L)."}, "answer": "A", "rationale": "A: Platelet count of 100,000/mm³ (100 x 10^9/L) is below the normal range and indicates thrombocytopenia, which is a decrease in the number of platelets in the blood. Thrombocytopenia can increase the risk of bleeding and bruising, and can be a serious adverse effect of enoxaparin. This laboratory result requires immediate action by the nurse, such as notifying the prescriber, monitoring for signs of bleeding, and withholding the next dose of enoxaparin. B: Hematocrit 45% (0.45 volume fraction) is within the normal range and does not indicate any problem with the client's red blood cells or oxygen-carrying capacity. C: Blood urea nitrogen (BUN) 20 mg/dL (7.1 mmol/L) is within the normal range and does not indicate any problem with the client's kidney function or hydration status. D: Serum creatinine 1.0 mg/dL (88.4 μmol/L) is within the normal range and does not indicate any problem with the client's kidney function or muscle metabolism.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P4", "subject": "Pharmacology", "question": "A client who experiences migraine headaches reports having fewer headaches since using the herbal remedy feverfew. Which information is most important for the nurse to include in a teaching plan for this client?", "options": {"A": "Increased anxiety and nervousness have been reported by those taking feverfew.", "B": "Feverfew may interact with aspirin or non-steroidal anti-inflammatory drugs.", "C": "Those with allergies to chamomile, ragweed, or yarrow should not take feverfew.", "D": "Abdominal pain, gas, nausea, vomiting, and diarrhea can occur when taking feverfew."}, "answer": "B", "rationale": "A: Increased anxiety and nervousness have been reported by some people taking feverfew, but this is not a common or serious side effect. It may be related to individual sensitivity or dosage. B: Feverfew may interact with aspirin or non-steroidal anti-inflammatory drugs (NSAIDs), such as ibuprofen or naproxen, which are commonly used for pain relief. Feverfew and these drugs can both inhibit platelet aggregation and increase the risk of bleeding. This information is most important for the nurse to include in a teaching plan for this client, especially if they are taking any of these medications or have a history of bleeding disorders. C: Those with allergies to chamomile, ragweed, or yarrow should not take feverfew, because they may have a cross-reactivity and experience an allergic reaction to feverfew. This information is important for the nurse to include in a teaching plan for this client, but it is not as critical as choice B. D: Abdominal pain, gas, nausea, vomiting, and diarrhea can occur when taking feverfew, but these are usually mild and transient side effects that do not require medical attention. They may be reduced by taking feverfew with food or water.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P5", "subject": "Pharmacology", "question": "A client is receiving orlistat as part of a weight management program. Which ongoing assessment should be included in the plan of care to determine the effectiveness of the medication?", "options": {"A": "Depression screening.", "B": "Body mass index.", "C": "Daily calorie count.", "D": "Serum protein levels."}, "answer": "B", "rationale": "A: Depression screening is not directly related to the effectiveness of orlistat, which is a medication that blocks the absorption of fat from the diet and helps to reduce weight. Depression screening may be important for the overall mental health of the client, but it is not an ongoing assessment for orlistat. B: Body mass index (BMI) is a measure of body fat based on height and weight, and it is used to assess the risk of obesity-related health problems. BMI is an ongoing assessment for orlistat, because it can indicate the progress and outcome of the weight management program. The goal of orlistat therapy is to achieve and maintain a healthy BMI. C: Daily calorie count is not an ongoing assessment for orlistat, because it does not reflect the amount of fat absorbed by the body. Orlistat works by blocking the action of lipase, an enzyme that breaks down fat in the intestine. Therefore, even if the client consumes a high-calorie diet, orlistat can prevent some of the fat from being absorbed and reduce weight. However, daily calorie count may be useful for monitoring the overall nutritional intake and energy balance of the client. D: Serum protein levels are not an ongoing assessment for orlistat, because they are not affected by the medication. Orlistat only blocks the absorption of fat, not protein or carbohydrates. Serum protein levels may be important for evaluating the nutritional status and organ function of the client, but they are not an indicator of orlistat effectiveness.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P6", "subject": "Pharmacology", "question": "A client with bulimia and depression who is taking phenelzine 90 mg daily is admitted to an acute care hospital for uncontrolled hypertension. Which dietary choices should the nurse instruct the client to avoid?", "options": {"A": "Beef tips with gravy.", "B": "Deep-fried shrimp.", "C": "Pepperoni pizza.", "D": "Pan-seared catfish."}, "answer": "C", "rationale": "A: Beef tips with gravy are not a dietary choice that should be avoided by a client taking phenelzine, which is a monoamine oxidase inhibitor (MAOI) that treats depression. Beef tips with gravy do not contain tyramine, which is a substance that can interact with MAOIs and cause a hypertensive crisis. B: Deep-fried shrimp are not a dietary choice that should be avoided by a client taking phenelzine, which is a monoamine oxidase inhibitor (MAOI) that treats depression. Deep-fried shrimp do not contain tyramine, which is a substance that can interact with MAOIs and cause a hypertensive crisis. C: Pepperoni pizza is a dietary choice that should be avoided by a client taking phenelzine, which is a monoamine oxidase inhibitor (MAOI) that treats depression. Pepperoni pizza contains tyramine, which is a substance that can interact with MAOIs and cause a hypertensive crisis. Tyramine is found in aged, fermented, cured, smoked, or pickled foods, such as cheese, salami, sauerkraut, soy sauce, beer, and wine. D: Pan-seared catfish is not a dietary choice that should be avoided by a client taking phenelzine, which is a monoamine oxidase inhibitor (MAOI) that treats depression. Pan-seared catfish does not contain tyramine, which is a substance that can interact with MAOIs and cause a hypertensive crisis.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P7", "subject": "Pharmacology", "question": "Which assessment finding requires nursing intervention prior to the administration of a prescribed dose of digoxin to an adult?", "options": {"A": "Apical pulse rate of 50 beats/minute.", "B": "Irregular apical pulse rhythm.", "C": "Presence of a systolic heart murmur.", "D": "Apical pulse heard best at the pulmonic site."}, "answer": "A", "rationale": "A: Apical pulse rate of 50 beats/minute requires nursing intervention prior to the administration of digoxin, which is a medication that slows down and strengthens the heartbeat. Digoxin can cause bradycardia, which is a slow heart rate below 60 beats/minute. Bradycardia can lead to inadequate blood flow and oxygen delivery to the body. The nurse should withhold the dose of digoxin and notify the prescriber if the apical pulse rate is below 60 beats/minute. B: Irregular apical pulse rhythm does not require nursing intervention prior to the administration of digoxin, which is a medication that treats arrhythmias, which are irregular heart rhythms. Digoxin can correct or prevent some types of arrhythmias, such as atrial fibrillation or flutter. The nurse should monitor the apical pulse rhythm and report any changes to the prescriber, but it is not a reason to withhold the dose of digoxin. C: Presence of a systolic heart murmur does not require nursing intervention prior to the administration of digoxin, which is a medication that improves the pumping function of the heart. A systolic heart murmur is a sound that occurs when the heart contracts and blood flows through a narrow or leaky valve. Digoxin can reduce the symptoms of heart failure, such as shortness of breath, fatigue, and edema, which may be associated with a systolic heart murmur. The nurse should document the presence and characteristics of the heart murmur, but it is not a reason to withhold the dose of digoxin. D: Apical pulse heard best at the pulmonic site does not require nursing intervention prior to the administration of digoxin, which is a medication that affects the electrical activity and contractility of the heart. The apical pulse is the heartbeat heard at the apex of the heart, which is located at the fifth intercostal space on the left midclavicular line. The pulmonic site is located at the second intercostal space on the left sternal border, where the sound of blood flow through the pulmonary valve can be heard. The nurse should listen to the apical pulse at the correct location, but it is not a reason to withhold the dose of digoxin.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P8", "subject": "Pharmacology", "question": "A client with multiple sclerosis starts a new prescription, baclofen, to control muscle spasticity. Three days later, the client calls the clinic nurse and reports feeling fatigued and dizzy. Which instruction should the nurse provide?", "options": {"A": "Increase intake of fluids and high protein foods.", "B": "Stop taking the medication immediately.", "C": "Obtain transportation to the emergency department.", "D": "Avoid hazardous activities until symptoms subside."}, "answer": "D", "rationale": "A: Increasing intake of fluids and high protein foods is not an instruction that the nurse should provide to the client who is taking baclofen, which is a medication that relaxes skeletal muscles and reduces spasticity. Fluids and high protein foods do not affect the action or side effects of baclofen. B: Stopping taking the medication immediately is not an instruction that the nurse should provide to the client who is taking baclofen, which is a medication that should be tapered off gradually under medical supervision. Abrupt withdrawal of baclofen can cause serious complications, such as seizures, hallucinations, and increased spasticity. C: Obtaining transportation to the emergency department is not an instruction that the nurse should provide to the client who is taking baclofen, which is a medication that can cause mild and transient side effects, such as fatigue and dizziness. These side effects are not life-threatening and usually subside as the body adjusts to the medication. D: Avoiding hazardous activities until symptoms subside is an instruction that the nurse should provide to the client who is taking baclofen, which is a medication that can impair the ability to drive, operate machinery, or perform other tasks that require alertness and coordination. The client should be advised to exercise caution and avoid activities that could result in injury until they are no longer experiencing fatigue and dizziness.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P9", "subject": "Pharmacology", "question": "A client with a cold is taking the antitussive medication benzonatate. Which assessment information indicates to the nurse that the medication is effective?", "options": {"A": "Expectorating bronchial secretions.", "B": "Reports reduced nasal discharge.", "C": "Able to sleep through the night.", "D": "Denies having coughing spells."}, "answer": "D", "rationale": "A: Expectorating bronchial secretions is not an assessment information that indicates that the antitussive medication benzonatate is effective. Benzonatate is a medication that suppresses the cough reflex by numbing the throat and lungs. It does not loosen or thin the mucus in the airways, which would facilitate expectoration. B: Reports reduced nasal discharge is not an assessment information that indicates that the antitussive medication benzonatate is effective. Benzonatate is a medication that suppresses the cough reflex by numbing the throat and lungs. It does not affect the production or drainage of nasal secretions, which are caused by inflammation and infection in the upper respiratory tract. C: Able to sleep through the night is not an assessment information that indicates that the antitussive medication benzonatate is effective. Benzonatate is a medication that suppresses the cough reflex by numbing the throat and lungs. It does not have any sedative or hypnotic effects, which would promote sleep. However, by reducing coughing, benzonatate may indirectly improve the quality of sleep for the client. D: Denies having coughing spells is an assessment information that indicates that the antitussive medication benzonatate is effective. Benzonatate is a medication that suppresses the cough reflex by numbing the throat and lungs. It reduces the frequency and intensity of coughing, which can relieve discomfort and irritation for the client.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P10", "subject": "Pharmacology", "question": "A client with bipolar disorder admitted with severe depression and suicidal ideation receives a prescription for lithium carbonate. Which instruction should the nurse provide to the client?", "options": {"A": "Eliminate use of nonsteroidal anti-inflammatory drugs (NSAIDs).", "B": "Monitor blood glucose levels daily.", "C": "Notify healthcare provider prior to dental procedures.", "D": "Avoid consuming all foods that contain iodine."}, "answer": "A", "rationale": "A: Eliminating use of nonsteroidal anti-inflammatory drugs (NSAIDs), such as ibuprofen or naproxen, is an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that stabilizes mood and prevents manic episodes. NSAIDs can increase the blood levels of lithium and cause toxicity, which can manifest as nausea, vomiting, tremors, confusion, or seizures. B: Monitoring blood glucose levels daily is not an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that does not affect the blood sugar levels or the risk of diabetes. Blood glucose levels may be important for the general health of the client, but they are not related to lithium therapy. C: Notifying healthcare provider prior to dental procedures is not an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that does not interact with local anesthetics or antibiotics that may be used during dental procedures. However, the client should inform the dentist about their medical history and medications, as a precaution. D: Avoiding consuming all foods that contain iodine is not an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that does not interfere with the thyroid function or the metabolism of iodine. Iodine is an essential nutrient that is found in many foods, such as seafood, dairy products, eggs, and iodized salt. Avoiding iodine can cause deficiency and lead to goiter or hypothyroidism.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P11", "subject": "Pharmacology", "question": "A client with bipolar disorder admitted with severe depression and suicidal ideation receives a prescription for lithium carbonate. Which instruction should the nurse provide to the client?", "options": {"A": "Eliminate use of nonsteroidal anti-inflammatory drugs (NSAIDs).", "B": "Monitor blood glucose levels daily.", "C": "Notify healthcare provider prior to dental procedures.", "D": "Avoid consuming all foods that contain iodine."}, "answer": "A", "rationale": "A: Eliminating use of nonsteroidal anti-inflammatory drugs (NSAIDs), such as ibuprofen or naproxen, is an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that stabilizes mood and prevents manic episodes. NSAIDs can increase the blood levels of lithium and cause toxicity, which can manifest as nausea, vomiting, tremors, confusion, or seizures. B: Monitoring blood glucose levels daily is not an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that does not affect the blood sugar levels or the risk of diabetes. Blood glucose levels may be important for the general health of the client, but they are not related to lithium therapy. C: Notifying healthcare provider prior to dental procedures is not an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that does not interact with local anesthetics or antibiotics that may be used during dental procedures. However, the client should inform the dentist about their medical history and medications, as a precaution. D: Avoiding consuming all foods that contain iodine is not an instruction that the nurse should provide to the client who is taking lithium carbonate, which is a medication that does not interfere with the thyroid function or the metabolism of iodine. Iodine is an essential nutrient that is found in many foods, such as seafood, dairy products, eggs, and iodized salt. Avoiding iodine can cause deficiency and lead to goiter or hypothyroidism.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P12", "subject": "Pharmacology", "question": "A client with open-angle glaucoma is using pilocarpine ophthalmic solution, a miotic agent. Which action should the nurse at the eye clinic include in evaluating the effectiveness of the medication?", "options": {"A": "Use Snellen chart to assess visual acuity.", "B": "Check amount of drainage from each eye.", "C": "Palpate eyelids for decreased swelling.", "D": "Review eye pressure measurements."}, "answer": "D", "rationale": "A: Using a Snellen chart
