 to assess visual acuity is not a direct measure of the effectiveness of pilocarpine, which is used to lower intraocular pressure by constricting the pupil and increasing aqueous humor outflow. Visual acuity may be affected by other factors, such as refractive errors, cataracts, or macular degeneration. B: Checking the amount of drainage from each eye is not a relevant action for evaluating the effectiveness of pilocarpine, which does not affect tear production or drainage. Excessive or abnormal eye drainage may indicate an infection, allergy, or injury. C: Palpating the eyelids for decreased swelling is not a useful action for evaluating the effectiveness of pilocarpine, which does not cause or reduce eyelid swelling. Eyelid swelling may be caused by inflammation, infection, allergy, or trauma. D: Reviewing eye pressure measurements is the correct action for evaluating the effectiveness of pilocarpine, which is used to lower intraocular pressure in patients with open-angle glaucoma. High intraocular pressure can damage the optic nerve and cause vision loss. Pilocarpine reduces intraocular pressure by constricting the pupil and increasing aqueous humor outflow.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P13", "subject": "Pharmacology", "question": "A client with myasthenia gravis receives a new prescription for pyridostigmine. Which information should the nurse obtain prior to administering the medication?", "options": {"A": "Trouble sleeping", "B": "Difficulty with urination", "C": "Unexplained weight loss", "D": "Recent oral intake"}, "answer": "D", "rationale": "A: Trouble sleeping is not a relevant information for administering pyridostigmine, which is a cholinesterase inhibitor that improves muscle strength and function in patients with myasthenia gravis. Trouble sleeping may be caused by other factors, such as stress, pain, or medication side effects. B: Difficulty with urination is not a pertinent information for administering pyridostigmine, which does not affect urinary function or bladder control. Difficulty with urination may indicate a urinary tract infection, prostate enlargement, or kidney stones. C: Unexplained weight loss is not a significant information for administering pyridostigmine, which does not affect metabolism or appetite. Unexplained weight loss may be a sign of an underlying condition, such as hyperthyroidism, diabetes, or cancer. D: Recent oral intake is the correct information for administering pyridostigmine, which should be taken on an empty stomach or before meals to enhance its absorption and effectiveness. Pyridostigmine can also help prevent or reduce dysphagia (difficulty swallowing), which is a common symptom of myasthenia gravis.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P14", "subject": "Pharmacology", "question": "The nurse is administering sevelamer during lunch to a client with chronic kidney disease (CKD). The client asks the nurse to bring the medication later. The nurse should describe which action of sevelamer as an explanation for taking it with meals?", "options": {"A": "Promotes stomach emptying and prevents gastric reflux.", "B": "Buffers hydrochloric acid and prevents gastric erosion.", "C": "Prevents indigestion associated with ingestion of spicy foods.", "D": "Binds with phosphorus in foods and prevents absorption."}, "answer": "D", "rationale": "A: Promoting stomach emptying and preventing gastric reflux is not a relevant action of sevelamer, which is a phosphate binder that lowers serum phosphate levels in patients with CKD. Gastric reflux may be caused by other factors, such as hiatal hernia, obesity, or spicy foods. B: Buffering hydrochloric acid and preventing gastric erosion is not a pertinent action of sevelamer, which does not affect gastric acidity or mucosal integrity. Gastric erosion may be caused by other factors, such as NSAIDs, alcohol, or Helicobacter pylori infection. C: Preventing indigestion associated with ingestion of spicy foods is not a significant action of sevelamer, which does not affect digestion or food tolerance. Indigestion may be caused by other factors, such as overeating, stress, or gallstones. D: Binding with phosphorus in foods and preventing absorption is the correct action of sevelamer, which should be taken with meals to reduce the amount of phosphorus that enters the bloodstream from the diet. High serum phosphate levels can cause bone loss, calcification of soft tissues, and secondary hyperparathyroidism in patients with CKD.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P15", "subject": "Pharmacology", "question": "When administering zolpidem to an older client, which computer documentation indicates that the desired outcome has been achieved?", "options": {"A": "Sleeps soundly through the night.", "B": "Decreased episodes of incontinence.", "C": "Improved ability to concentrate.", "D": "Exhibits fewer emotional outbursts."}, "answer": "A", "rationale": "A: Sleeping soundly through the night is the desired outcome of administering zolpidem, which is a sedative-hypnotic that induces sleep by enhancing the activity of GABA, an inhibitory neurotransmitter. Zolpidem is used to treat insomnia, especially difficulty falling asleep. B: Decreasing episodes of incontinence is not a relevant outcome of administering zolpidem, which does not affect urinary function or bladder control. Incontinence may be caused by other factors, such as aging, prostate problems, or urinary tract infections. C: Improving ability to concentrate is not a pertinent outcome of administering zolpidem, which does not affect cognitive function or attention span. Zolpidem may actually impair memory and cause daytime drowsiness or confusion in some patients. D: Exhibiting fewer emotional outbursts is not a significant outcome of administering zolpidem, which does not affect mood or behavior. Zolpidem may actually cause paradoxical reactions, such as agitation, aggression, or hallucinations in some patients. : [Zolpidem (Oral Route)] : [Insomnia] : [Urinary Incontinence] : [Concentration Problems]", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P16", "subject": "Pharmacology", "question": "The nurse is teaching a client with type 1 diabetes mellitus (DM) about the onset, peak, and duration of a new prescription for glargine insulin. If the insulin is administered at 0800, when is the client most likely to experience hypoglycemia?", "options": {"A": "Midmorning.", "B": "No peak occurs.", "C": "Midafternoon.", "D": "Shortly after midnight."}, "answer": "B", "rationale": "A: Midmorning is not a likely time for experiencing hypoglycemia after administering glargine insulin at 0800, because glargine insulin has a slow onset of action (about 1 hour) and does not have a pronounced peak effect. Glargine insulin is a long-acting insulin that provides a steady level of insulin throughout the day and night. B: No peak occurs is the correct answer for when hypoglycemia is most likely to occur after administering glargine insulin at 0800, because glargine insulin does not have a pronounced peak effect that could cause a sudden drop in blood glucose levels. Glargine insulin is a long-acting insulin that provides a steady level of insulin throughout the day and night. C: Midafternoon is not a likely time for experiencing hypoglycemia after administering glargine insulin at 0800, because glargine insulin has a long duration of action (about 24 hours) and does not have a pronounced peak effect. Glargine insulin is a long-acting insulin that provides a steady level of insulin throughout the day and night. D: Shortly after midnight is not a likely time for experiencing hypoglycemia after administering glargine insulin at 0800, because glargine insulin has a long duration of action (about 24 hours) and does not have a pronounced peak effect. Glargine insulin is a long-acting insulin that provides a steady level of insulin throughout the day and night.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P17", "subject": "Pharmacology", "question": "The nurse is administering sevelamer during lunch to a client with chronic kidney disease (CKD). The client asks the nurse to bring the medication later. The nurse should describe which action of sevelamer as an explanation for taking it with meals?", "options": {"A": "Promotes stomach emptying and prevents gastric reflux.", "B": "Buffers hydrochloric acid and prevents gastric erosion.", "C": "Prevents indigestion associated with ingestion of spicy foods.", "D": "Binds with phosphorus in foods and prevents absorption."}, "answer": "D", "rationale": "A: Promoting stomach emptying and preventing gastric reflux is not a relevant action of sevelamer, which is a phosphate binder that lowers serum phosphate levels in patients with CKD. Gastric reflux may be caused by other factors, such as hiatal hernia, obesity, or spicy foods. B: Buffering hydrochloric acid and preventing gastric erosion is not a pertinent action of sevelamer, which does not affect gastric acidity or mucosal integrity. Gastric erosion may be caused by other factors, such as NSAIDs, alcohol, or Helicobacter pylori infection. C: Preventing indigestion associated with ingestion of spicy foods is not a significant action of sevelamer, which does not affect digestion or food tolerance. Indigestion may be caused by other factors, such as overeating, stress, or gallstones. D: Binding with phosphorus in foods and preventing absorption is the correct action of sevelamer, which should be taken with meals to reduce the amount of phosphorus that enters the bloodstream from the diet. High serum phosphate levels can cause bone loss, calcification of soft tissues, and secondary hyperparathyroidism in patients with CKD.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P18", "subject": "Pharmacology", "question": "A client receives a new prescription for somatropin. Which information provided by the client indicates a need for further education by the nurse?", "options": {"A": "Store unused vials at room temperature.", "B": "Rotate injection sites to minimize discomfort.", "C": "Discard the medication if the solution is cloudy.", "D": "Administer the medication subcutaneously."}, "answer": "A", "rationale": "A: Storing unused vials at room temperature is incorrect information that indicates a need for further education by the nurse, because somatropin is a growth hormone that should be stored in the refrigerator (2°C to 8°C) until use. Exposure to heat or light can degrade the medication and reduce its effectiveness. B: Rotating injection sites to minimize discomfort is correct information that does not indicate a need for further education by the nurse, because somatropin is administered subcutaneously and repeated injections at the same site can cause skin irritation, bruising, or infection. C: Discarding the medication if the solution is cloudy is correct information that does not indicate a need for further education by the nurse, because somatropin is a clear and colorless solution that should not be used if it appears cloudy, discolored, or contains particles. This may indicate contamination or degradation of the medication. D: Administering the medication subcutaneously is correct information that does not indicate a need for further education by the nurse, because somatropin is a growth hormone that is given by subcutaneous injection using a syringe or a pen device. Subcutaneous injection allows for better absorption and bioavailability of the medication.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P19", "subject": "Pharmacology", "question": "Azithromycin is prescribed for a client with Chlamydia trachomatis. In providing client teaching about the medication, the nurse should emphasize the importance of reporting the onset of which symptom to the health care provider?", "options": {"A": "Flatulence and nausea.", "B": "Urinary frequency.", "C": "Yellow sclera.", "D": "Headache."}, "answer": "C", "rationale": "A: Flatulence and nausea are common side effects of azithromycin, which is a macrolide antibiotic that inhibits bacterial protein synthesis. These symptoms are usually mild and transient, and do not require reporting to the health care provider unless they are severe or persistent. B: Urinary frequency is not a relevant symptom of azithromycin, which does not affect urinary function or bladder control. Urinary frequency may be caused by other factors, such as infection, diabetes, or pregnancy. C: Yellow sclera is a serious symptom of azithromycin, which indicates liver damage or jaundice. Azithromycin can cause hepatotoxicity, which is a rare but potentially fatal adverse reaction. Yellow sclera should be reported to the health care provider immediately, as it may require discontinuation of the medication and liver function tests. D: Headache is a common side effect of azithromycin, which is a macrolide antibiotic that inhibits bacterial protein synthesis. This symptom is usually mild and transient, and does not require reporting to the health care provider unless it is severe or persistent.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P20", "subject": "Pharmacology", "question": "A client recently diagnosed with Parkinson's disease receives a new prescription for carbidopa-levodopa, a dopaminergic drug. To reduce the client's risk for injury, which instruction should the nurse provide?", "options": {"A": "Obtain a hospital bed with side rails and an over-bed trapeze.", "B": "Place small rugs on smooth surfaces such as tile or wood floors.", "C": "Use caution when changing from a sitting to a standing position.", "D": "Ambulate using a four point cane or a walker with wheels."}, "answer": "C", "rationale": "A: Obtaining a hospital bed with side rails and an over-bed trapeze is not a necessary instruction for reducing the risk of injury for a client taking carbidopa-levodopa, which is a combination of two drugs that increase dopamine levels in the brain and improve motor function in patients with Parkinson's disease. A hospital bed may be helpful for patients with severe mobility impairment or bedridden status, but not for all patients with Parkinson's disease. B: Placing small rugs on smooth surfaces such as tile or wood floors is an incorrect instruction for reducing the risk of injury for a client taking carbidopa-levodopa, which is a combination of two drugs that increase dopamine levels in the brain and improve motor function in patients with Parkinson's disease. Small rugs can pose a tripping hazard and increase the risk of falls, especially for patients with impaired balance or coordination. C: Using caution when changing from a sitting to a standing position is a correct instruction for reducing the risk of injury for a client taking carbidopa-levodopa, which is a combination of two drugs that increase dopamine levels in the brain and improve motor function in patients with Parkinson's disease. Carbidopa-levodopa can cause orthostatic hypotension, which is a sudden drop in blood pressure when changing positions. This can cause dizziness, fainting, or falls. Patients should change positions slowly and carefully, and use support if needed. D: Ambulating using a four point cane or a walker with wheels is not a specific instruction for reducing the risk of injury for a client taking carbidopa-levodopa, which is a combination of two drugs that increase dopamine levels in the brain and improve motor function in patients with Parkinson's disease. The type of assistive device that is appropriate for each patient depends on their individual needs and abilities. Some patients may not need any device, while others may need different types of canes, walkers, or wheelchairs.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}, {"id": "P21", "subject": "Pharmacology", "question": "A client is discharged with a prescription for warfarin. Which discharge instruction should the nurse emphasize to the client?", "options": {"A": "Take a multi-vitamin supplement daily.", "B": "Use an astringent for superficial bleeding.", "C": "Add large amounts of spinach to the diet.", "D": "Avoid going barefoot, especially outside."}, "answer": "D", "rationale": "A: Taking a multi-vitamin supplement daily is not a necessary instruction for a client taking warfarin, which is an anticoagulant that inhibits the synthesis of vitamin K-dependent clotting factors and prevents blood clots. However, some vitamins, such as vitamin K, vitamin E, and vitamin C, can interact with warfarin and affect its effectiveness. Patients should consult their health care provider before taking any supplements or herbal products. B: Using an astringent for superficial bleeding is not a sufficient instruction for a client taking warfarin, which is an anticoagulant that inhibits the synthesis of vitamin K-dependent clotting factors and prevents blood clots. Warfarin can increase the risk of bleeding, both internally and externally. Patients should report any signs of bleeding, such as bruising, nosebleeds, gum bleeding, blood in urine or stool, or prolonged bleeding from cuts or wounds, to their health care provider. They should also avoid activities or products that can increase the risk of bleeding, such as shaving with a razor, using dental floss, or taking aspirin or NSAIDs. C: Adding large amounts of spinach to the diet is an incorrect instruction for a client taking warfarin, which is an anticoagulant that inhibits the synthesis of vitamin K-dependent clotting factors and prevents blood clots. Spinach is a leafy green vegetable that is high in vitamin K, which can counteract the effect of warfarin and increase the risk of clotting. Patients should maintain a consistent intake of vitamin K-rich foods and avoid sudden changes in their diet. D: Avoiding going barefoot, especially outside, is a correct instruction for a client taking warfarin, which is an anticoagulant that inhibits the synthesis of vitamin K-dependent clotting factors and prevents blood clots. Warfarin can increase the risk of bleeding, both internally and externally. Patients should protect their feet from injury or infection by wearing shoes or slippers at all times.", "source": "RN HESI Pharmacology Exam Nancy Thomas(1).docx"}];
let subject='Fundamentals',mode='practice',idx=0,answered=false;
const state=JSON.parse(localStorage.getItem('hesiQB')||'{"answers":{},"streak":0}');
function save(){localStorage.setItem('hesiQB',JSON.stringify(state))}
function subjectQs(){return BANK.filter(q=>q.subject===subject)}
function filtered(){let a=subjectQs();if(mode==='wrong')a=a.filter(q=>state.answers[q.id]?.status==='wrong');if(mode==='mixed')a=[...a].sort(()=>Math.random()-.5);return a}
function stats(){let s=subjectQs(),ok=0,bad=0;for(const q of s){let x=state.answers[q.id];if(x?.status==='correct')ok++;if(x?.status==='wrong')bad++}document.getElementById('ok').textContent=ok;document.getElementById('bad').textContent=bad;document.getElementById('streak').textContent=state.streak||0}
function setSubject(s){subject=s;idx=0;answered=false;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===s));render()}
function setMode(m,el){mode=m;idx=0;answered=false;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reverseFor(q){let pool=subjectQs().filter(x=>x.id!==q.id);let ds=pool.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.question);let opts=[q.question,...ds].sort(()=>Math.random()-.5);return {question:`A resposta/ação correta é: “${q.options[q.answer]}”\n\nQual situação clínica corresponde melhor a essa resposta?`,options:opts,correct:opts.indexOf(q.question)} }
let currentReverse=null;
function render(){stats();let qs=filtered(),c=document.getElementById('card');if(!qs.length){c.innerHTML=`<div class="empty">${mode==='wrong'?'Você ainda não tem questões erradas nesta matéria.':'Nenhuma questão disponível neste modo.'}</div>`;return}if(idx>=qs.length)idx=0;let q=qs[idx];answered=false;currentReverse=mode==='reverse'?reverseFor(q):null;let question=currentReverse?currentReverse.question:q.question;let opts=currentReverse?currentReverse.options:Object.values(q.options);let labels=['A','B','C','D'];c.innerHTML=`<div class="meta"><span>${subject}${mode==='reverse'?'<span class="badge">REVERSE</span>':''}</span><span class="counter">Questão ${idx+1} de ${qs.length}</span></div><div class="q">${esc(question).replace(/\n/g,'<br>')}</div><div class="answers">${opts.map((o,i)=>`<button class="answer" data-i="${i}" onclick="choose(${i})"><b>${labels[i]}.</b> ${esc(o)}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="actions"><button class="small" onclick="restart()">Recomeçar</button><button class="small next" id="next" onclick="next()">Próxima →</button></div><div class="source">Fonte original: ${esc(q.source)}</div>`}
function choose(i){if(answered)return;answered=true;let qs=filtered(),q=qs[idx],correctIndex=currentReverse?currentReverse.correct:'ABCD'.indexOf(q.answer),buttons=[...document.querySelectorAll('.answer')],right=i===correctIndex;buttons.forEach((b,j)=>{if(j===correctIndex)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});let fb=document.getElementById('fb');if(mode==='reverse'){fb.innerHTML=`<div class="result">${right?'✅ Correto':'❌ Incorreto'}</div><div><b>Conceito original:</b> ${esc(q.rationale)}</div><div class="concept"><b>🔄 Por que este treino?</b> Você recebeu primeiro a resposta correta e precisou reconhecer a situação clínica correspondente.</div>`}else{let prev=state.answers[q.id]?.status;if(right){state.answers[q.id]={status:'correct',choice:'ABCD'[i]};state.streak=(state.streak||0)+1}else{state.answers[q.id]={status:'wrong',choice:'ABCD'[i]};state.streak=0}save();fb.innerHTML=`<div class="result">${right?'✅ Correto':'❌ Incorreto — resposta correta: '+q.answer}</div><div>${esc(q.rationale)}</div><div class="concept"><b>🧠 Conceito-chave:</b> ${esc(q.rationale.split(/(?<=[.!?])\s+/)[0])}</div>`;stats()}fb.classList.add('show')}
function next(){let qs=filtered();if(!qs.length)return;idx=(idx+1)%qs.length;render()}
function restart(){idx=0;render()}
render();
</script></body></html>
